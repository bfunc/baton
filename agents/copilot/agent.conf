# Baton config for GitHub Copilot (CLI hooks; the instruction files also work for Copilot in VS Code)
AGENT_NAME="GitHub Copilot"
# project files that point the agent to the protocol: one "file|line" per line
INSTR=".github/copilot-instructions.md|Before any work, read and follow .baton/AGENT.md."
# how the start hook hands its text to the agent: text (stdout) or json ({"additionalContext": ...})
BRIEF_FORMAT=json
# user-level hooks file of Copilot CLI, written from hooks.json
HOOKS_FILE="${COPILOT_HOME:-$HOME/.copilot}/hooks/baton.json"
# the CLI, for --live
CLI=copilot

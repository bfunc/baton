# Baton config for Claude Code
AGENT_NAME="Claude Code"
# project files that point the agent to the protocol: one "file|line" per line
INSTR="CLAUDE.md|@.baton/AGENT.md"
# how the start hook hands its text to the agent: text (stdout) or json ({"additionalContext": ...})
BRIEF_FORMAT=text
# where the hooks go: merged into the user settings
SETTINGS="$HOME/.claude/settings.json"
